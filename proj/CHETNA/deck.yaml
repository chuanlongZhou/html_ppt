      note1: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: ["CO₂ congestion: extra CO₂ emitted at actual speed relative to free-flow conditions, per vehicle-km.", "Below each city average, road-level differences stand out."] }
      lab2: { type: text, size: 24, weight: bold, color: accent-2, lineHeight: 1.2, frame: [1340, 130, 460, 36], text: "Explain · what is associated" }
      sen2: { type: text, size: 34, weight: bold, color: accent, lineHeight: 1.25, frame: [1340, 182, 460, 400], text: "Mobility, socioeconomic conditions and urban form jointly explain modelled differences." }
      note2: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: ["Fleet diversity, night-time light and road-related indicators rank highest.", "Model associations, not causal effects."] }
