    notes: "Question: how does congestion emission vary, which factors relate to the differences, and what urban types do they form? The map shows that efficiency differs at road and city scale. The explanatory model links the differences to traffic composition, socioeconomic activity and urban form. Combining these factors reveals different urban configurations, so similar congestion can have different urban backgrounds. Transition: traffic also produces air pollution, so next we connect emissions to the exposure of the people who live there."


