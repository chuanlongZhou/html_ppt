        notes: On the final click, mask all research content and reveal the centred summary box. Satellite imagery and AI provide a facility-level
          monitoring framework for activity and environmental risks; these preliminary fire observations do not directly quantify CO2
          emissions or coal loss.
    notes: "Sources: presenter brief and assets/part4/s4/6.png–9.png. The database's nationwide mine count and statistical unit were not
      supplied; do not substitute the 15 units in the FRP comparison for a national total. Talchir shows persistent thermal hotspots. Use
      figure 9's Singrauli value of 86.14 MW (not the 83.14 MW in an older workshop text), and Jharia 12.53 MW. FRP is fire radiative power,
      not a direct estimate of CO2 emissions or coal loss. Ongoing work connects thermal observations with emission estimates, resource losses
      and independent validation."

