          - - enter: closing
              effect: fade
              duration: 400
    notes: "Question: how does the relative role of pollution exposure and household vulnerability change across neighbourhoods and cities? We
      distinguish pollution exposure, household vulnerability and double burden. Their relative importance is uneven within a city and differs
      between cities. This helps identify where pollution deserves attention, where household conditions matter more, and who carries both
      burdens. Closing: CHETNA integrates big data, machine learning and physical modelling to inform urban planning and public health
      policy."

