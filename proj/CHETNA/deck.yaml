  - id: st1-method
    section: Selected Research
    purpose: Show how incomplete traffic observations become a spatially and temporally resolved emission dataset
    layout: free
    chrome: { header: { left: "Reconstructing urban traffic emissions" } }
    objects:
      f1: { type: image, src: assets/part4/s1/1.png, fit: contain, radius: 12, shadow: true, frame: [120, 160, 1180, 769], alt: "CHETNA-Road workflow: data preprocessing, emission modeling, validation and final output" }
      f2: { type: image, src: assets/part4/s1/2.png, fit: contain, radius: 12, shadow: true, frame: [120, 179, 1180, 732], alt: "Annual road CO2 emissions in six Indian metros" }
      dA: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f1, box: [0.04, 0.02, 0.93, 0.335], z: 4 }
      dB: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f1, box: [0.04, 0.34, 0.93, 0.33], z: 4 }
      dC: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f1, box: [0.04, 0.68, 0.265, 0.31], z: 4 }
      dD: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f1, box: [0.325, 0.68, 0.65, 0.31], z: 4 }
      hl_scale: { type: shape, geom: roundRect, radius: 12, fill: transparent, stroke: accent-2, strokeWidth: 6, on: f1, box: [0.77, 0.12, 0.185, 0.16], z: 5 }
      hl_ef: { type: shape, geom: roundRect, radius: 12, fill: transparent, stroke: accent-2, strokeWidth: 6, on: f1, box: [0.445, 0.355, 0.19, 0.3], z: 5 }
      g_blr: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f2, box: [0.01, 0.02, 0.32, 0.4], z: 4 }
      g_hyd: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f2, box: [0.32, 0.03, 0.34, 0.36], z: 4 }
      g_kol: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f2, box: [0.665, 0.03, 0.32, 0.36], z: 4 }
      g_che: { type: shape, geom: roundRect, radius: 10, fill: "#FFFFFF", opacity: 0.8, on: f2, box: [0.32, 0.43, 0.26, 0.56], z: 4 }
      lab1: { type: text, size: 24, weight: bold, color: accent-2, lineHeight: 1.2, frame: [1340, 130, 460, 36], text: "A · Data reconstruction" }
      sen1: { type: text, size: 34, weight: bold, color: accent, lineHeight: 1.25, frame: [1340, 182, 460, 400], text: "Statistical and machine-learning methods reconstruct missing traffic observations." }
      note1: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: ["Street-level GPS speed and flow", "Statistical imputation + LightGBM fill the gaps", "Scaling corrects partial fleet coverage"] }
      lab2: { type: text, size: 24, weight: bold, color: accent-2, lineHeight: 1.2, frame: [1340, 130, 460, 36], text: "B · Emission modelling" }
      sen2: { type: text, size: 34, weight: bold, color: accent, lineHeight: 1.25, frame: [1340, 182, 460, 400], text: "Speed-dependent emission factors connect traffic conditions to CO₂ and pollutant emissions." }
      note2: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: "Operating speed enters the emission calculation, so changing traffic conditions show up in the estimates." }
      lab3: { type: text, size: 24, weight: bold, color: accent-2, lineHeight: 1.2, frame: [1340, 130, 460, 36], text: "C–D · Consistency and data product" }
      sen3: { type: text, size: 34, weight: bold, color: accent, lineHeight: 1.25, frame: [1340, 182, 460, 400], text: "The resulting inventory supports spatial and temporal analysis of urban traffic." }
      note3: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: ["Consistency comparison with other inventories", "Daily gridded product, city by city"] }
      lab4: { type: text, size: 24, weight: bold, color: accent-2, lineHeight: 1.2, frame: [1340, 130, 460, 36], text: "D · Data product" }
      note4: { type: text, size: 24, color: muted, lineHeight: 1.45, frame: [1340, 470, 460, 330], text: "Result form: annual road CO₂ on a 0.005° grid, Mumbai and Delhi in focus." }
    states:
      - show: [f1, dB, dC, dD, hl_scale, lab1, sen1, note1]
        notes: "GPS speed and flow from streets are incomplete; imputation fills gaps, scaling corrects the covered fleet."
        steps:
          - [{ enter: hl_scale, effect: fade, duration: 400 }]
      - show: [f1, dA, dC, dD, hl_ef, lab2, sen2, note2]
        transition: { duration: 400 }
        notes: "Highlight the speed-dependent emission factor curve."
        steps:
          - [{ enter: hl_ef, effect: fade, duration: 400 }]
      - show: [f1, dA, dB, lab3, sen3, note3]
        transition: { duration: 400 }
        notes: "Consistency comparison and the final daily gridded product."
      - show: [f2, g_blr, g_hyd, g_kol, g_che, lab4, sen3, note4]
        transition: { duration: 400 }
        notes: "Result form: city panels of the gridded product."
    notes: "Question: how do we turn incomplete traffic observations into emission data that can be used to analyse urban systems? We first rebuild traffic activity and correct data coverage. Speed-dependent emission factors then turn real traffic conditions into CO₂ and pollutant emissions. This foundation lets us study differences between roads, between cities and over time. Transition: with this base, why does traffic efficiency differ between these cities?"


