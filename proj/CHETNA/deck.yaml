deck:
  title: CHETNA
  subtitle: CO₂ and Pollutants Emission from 100+ Indian Cities
  author: Chuanlong Zhou
  slideNumber: false
  transition: fade
  theme: theme.yaml
  chrome:
    caps: true
    rule: { header: true, footer: false }
    header: { left: "" }

scenes:
  # 开场：首字母缩略词页 morph 成品牌页（C H E T N A 六个字母原地放大并靠拢，其余文字淡出）
  - id: opening
    kind: opening
    chrome: false
    purpose: 开场：先交代项目全称与团队，再把首字母收拢成 CHETNA 品牌页
    patterns: [morph.acronym-collapse]
    layout: free
    objects:
      bg: { type: image, src: assets/bg.jpg, frame: [0, 0, 1920, 1080], alt: Aerial view of Mumbai }
      shade: { type: shape, geom: rect, fill: accent-3, opacity: 0.8, frame: [0, 0, 1920, 1080] }
      fade: { type: shape, geom: rect, fill: "linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.93))", frame: [0, 870, 1920, 210] }
      source: { type: text, role: caption, font: display, size: 20, color: "#C9CED6", align: right, frame: [900, 14, 1000, 30], text: "Aerial view of Mumbai by Johnny Miller, https://unequalscenes.com/mumbai" }

      # 六个首字母：状态 1 是缩略词，状态 2 是品牌大字
      c: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [114, 323, 155, 174], text: C }
      h: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [372, 323, 162, 174], text: H }
      e: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [724, 323, 121, 174], text: E }
      t: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [957, 323, 130, 174], text: T }
      n: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [1248, 323, 166, 174], text: N }
      a: { type: text, size: 174, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [1551, 323, 152, 174], text: A }

      w1: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [253, 450, 140, 50], text: ity-wise }
      w2: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [511, 450, 235, 50], text: igh-resolution }
      w3: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [830, 450, 138, 50], text: mission }
      w4: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [1072, 450, 198, 50], text: racking and }
      w5: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [1391, 450, 170, 50], text: ationwide }
      w6: { type: text, size: 34, color: "#FFFFFF", lineHeight: 1, frame: [1691, 450, 123, 50], text: nalysis }

      authors:
        type: text
        size: 34
        color: "#FFFFFF"
        align: center
        frame: [160, 540, 1600, 130]
        text:
          - "Chuanlong Zhou¹, Philippe Ciais¹, Harish C. Phuleria², Arnab Jana², Fouzi Benkhelifa³"
          - "& the CHETNA Group"
      affil:
        type: text
        size: 26
        color: "#FFFFFF"
        frame: [505, 690, 1100, 160]
        text:
          - "¹ Laboratoire des Sciences du Climat et de l’Environnement (LSCE), France"
          - "² Indian Institute of Technology Bombay (IITB), India"
          - "³ NEXQT, France"

      lsce: { type: image, src: assets/logos/lsce.png, fit: contain, frame: [62, 994, 183, 76] }
      iit: { type: image, src: assets/logos/iit.png, fit: contain, frame: [305, 994, 285, 76] }
      nexqt: { type: image, src: assets/logos/nexqt.png, fit: contain, frame: [665, 995, 132, 58] }
      grantham: { type: image, src: assets/logos/grantham.png, fit: contain, frame: [866, 994, 451, 77] }
      um: { type: image, src: assets/logos/um.png, fit: contain, frame: [1371, 995, 211, 75] }
      tsinghua: { type: image, src: assets/logos/tsinghua.png, fit: contain, frame: [1640, 994, 196, 76] }

      # 状态 2 才出现
      tagline: { type: text, size: 50, weight: bold, color: ink, align: center, frame: [160, 605, 1600, 90], text: "CO₂ and Pollutants Emission from 100+ Indian Cities" }
      logo: { type: image, src: assets/logos/main.png, fit: contain, frame: [1502, 427, 163, 163] }

    states:
      - show: [bg, shade, fade, source, c, h, e, t, n, a, w1, w2, w3, w4, w5, w6, authors, affil, lsce, iit, nexqt, grantham, um, tsinghua]
      - show: [bg, shade, c, h, e, t, n, a, tagline, logo]
        override:
          shade: { fill: bg, opacity: 0.6 }
          c: { size: 250, color: ink, frame: [415, 372, 181, 290] }
          h: { size: 250, color: ink, frame: [576, 372, 221, 290] }
          e: { size: 250, color: ink, frame: [776, 372, 167, 290] }
          t: { size: 250, color: ink, frame: [943, 372, 153, 290] }
          n: { size: 250, color: ink, frame: [1076, 372, 221, 290] }
          a: { size: 250, color: ink, frame: [1276, 372, 181, 290] }
        transition: { duration: 1100 }

  # Part 1 · 第一页：Total Emission → Policy 的链条里，中间缺一环 “Information Gap”（用不填充的框装下三段式解释）；同一张图负责镜头与注释
  - id: why-resolution
    section: What is CHETNA
    purpose: Show that the step from total emissions to policy hides an information gap, and that high-resolution inventories close it
    patterns: [image.zoom-region, image.arrow-label, morph.focus-zoom, build.cards-stagger]
    layout: free
    chrome: { header: { left: "Why high-resolution emission inventory" } }
    objects:
      img: { type: image, src: "assets/part 1/1.png", frame: [800, 110, 1040, 780], radius: 24, shadow: true, alt: "Heat map of emissions over a city: industry, power plant, airport, highway and housing" }

      # 左列纵向链条：Total Emission ↓ Policy；缺口出现后 Policy 沉到底部，Information Gap 是中间的空心框
      te: { type: shape, fill: accent, color: "#FFFFFF", size: 36, weight: bold, align: center, valign: middle, padding: 0, frame: [120, 120, 620, 80], text: Total Emission }
      ig: { type: shape, fill: transparent, stroke: accent-2, strokeWidth: 4, color: accent-2, size: 34, weight: bold, align: center, valign: top, padding: 14, frame: [120, 310, 620, 480], text: Information Gap }
      po: { type: shape, fill: accent-3, color: "#FFFFFF", size: 36, weight: bold, align: center, valign: middle, padding: 0, frame: [120, 310, 620, 80], text: Policy }
      a1: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [375, 241, 110, 28] }
      a2: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [375, 831, 110, 28] }
      q: { type: shape, geom: ellipse, fill: accent-2, color: "#FFFFFF", size: 36, weight: bold, align: center, valign: middle, padding: 0, frame: [482, 227, 56, 56], text: "?" }

      # 缺口里的三段式：为什么会有缺口
      c1: { type: shape, align: center, fill: surface, shadow: true, size: 24, valign: middle, padding: 12, frame: [140, 380, 580, 108], text: ["# Top-down statistics", "Annual energy use, industrial output"] }
      c2: { type: shape, align: center, fill: surface, shadow: true, size: 24, valign: middle, padding: 12, frame: [140, 510, 580, 108], text: ["# Spatial proxies + typical profiles", "Fixed maps and time curves"] }
      c3: { type: shape, align: center, fill: accent-2-soft, shadow: true, size: 24, valign: middle, padding: 12, frame: [140, 640, 580, 108], text: ["# Regional Emission Map (10km)", "Allocated, not observed"] }

      # 结论：新范式（三个框 + 箭头）
      m1: { type: shape, fill: accent-3-soft, color: ink, size: 30, weight: bold, align: center, valign: middle, padding: 12, lineHeight: 1.3, frame: [120, 170, 620, 150], text: "Near-real-time Activities\\nAccurate Emission Factors" }
      m2: { type: shape, fill: accent, color: "#FFFFFF", size: 30, weight: bold, align: center, valign: middle, padding: 12, frame: [120, 400, 620, 120], text: High-resolution Sectoral Emission Inventory (500m) }
      m3: { type: shape, fill: accent-3, color: "#FFFFFF", size: 32, weight: bold, align: center, valign: top, padding: 22, frame: [120, 600, 620, 190], text: "Spatially Explicit Research\\n& Policy" }
      m3s: { type: text, size: 22, color: "#FFFFFF", opacity: 0.92, align: center, frame: [144, 716, 572, 70], text: Hotspot identification · Exposure & health impacts · Targeted mitigation }
      ma1: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [390, 346, 80, 28] }
      ma2: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [390, 546, 80, 28] }

      # 部门标签 + 圆头引线（State 0 与最后一页复用）
      l_ind: { type: shape, geom: roundRect, radius: 14, fill: surface, color: "#F2731D", stroke: "#F2731D", strokeWidth: 3, size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.0490, 0.300, 0.1869, 0.060], text: "   Industry" }
      n_ind: { type: shape, geom: line, on: img, from: [0.12, 0.3], to: [0.14, 0.2], stroke: "#FFFFFF", strokeWidth: 4 }
      d_ind: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: "#F2731D", strokeWidth: 3, on: img, box: [0.1320, 0.1893, 0.0160, 0.0213] }
      i_ind: { type: image, src: "assets/part 1/industrial.svg", fit: contain, on: img, box: [0.0721, 0.3130, 0.03, 0.04] }
      l_pow: { type: shape, geom: roundRect, radius: 14, fill: surface, color: "#E6BA3D", stroke: "#E6BA3D", strokeWidth: 3, size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.4172, 0.250, 0.1608, 0.060], text: "   Power" }
      n_pow: { type: shape, geom: line, on: img, from: [0.475, 0.25], to: [0.5, 0.14], stroke: "#FFFFFF", strokeWidth: 4 }
      d_pow: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: "#E6BA3D", strokeWidth: 3, on: img, box: [0.4920, 0.1293, 0.0160, 0.0213] }
      i_pow: { type: image, src: "assets/part 1/power.svg", fit: contain, on: img, box: [0.4402, 0.2630, 0.03, 0.04] }
      l_avi: { type: shape, geom: roundRect, radius: 14, fill: surface, color: "#3B6D5C", stroke: "#3B6D5C", strokeWidth: 3, size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.7497, 0.420, 0.1856, 0.060], text: "   Aviation" }
      n_avi: { type: shape, geom: line, on: img, from: [0.82, 0.42], to: [0.82, 0.3], stroke: "#FFFFFF", strokeWidth: 4 }
      d_avi: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: "#3B6D5C", strokeWidth: 3, on: img, box: [0.8120, 0.2893, 0.0160, 0.0213] }
      i_avi: { type: image, src: "assets/part 1/aviation.svg", fit: contain, on: img, box: [0.7727, 0.4330, 0.03, 0.04] }
      l_tra: { type: shape, geom: roundRect, radius: 14, fill: surface, color: "#89B32B", stroke: "#89B32B", strokeWidth: 3, size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.6369, 0.560, 0.2013, 0.060], text: "   Transport" }
      n_tra: { type: shape, geom: line, on: img, from: [0.64, 0.56], to: [0.5, 0.46], stroke: "#FFFFFF", strokeWidth: 4 }
      d_tra: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: "#89B32B", strokeWidth: 3, on: img, box: [0.4920, 0.4493, 0.0160, 0.0213] }
      i_tra: { type: image, src: "assets/part 1/ground transport.svg", fit: contain, on: img, box: [0.6600, 0.5730, 0.03, 0.04] }
      l_res: { type: shape, geom: roundRect, radius: 14, fill: surface, color: "#9C4788", stroke: "#9C4788", strokeWidth: 3, size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.1194, 0.620, 0.2163, 0.060], text: "   Residential" }
      n_res: { type: shape, geom: line, on: img, from: [0.21, 0.62], to: [0.31, 0.5], stroke: "#FFFFFF", strokeWidth: 4 }
      d_res: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: "#9C4788", strokeWidth: 3, on: img, box: [0.3020, 0.4893, 0.0160, 0.0213] }
      i_res: { type: image, src: "assets/part 1/residential.svg", fit: contain, on: img, box: [0.1425, 0.6330, 0.03, 0.04] }

      # State 4：公路上的三个问题
      ring: { type: shape, geom: ellipse, fill: transparent, stroke: "#FFFFFF", strokeWidth: 6, on: img, box: [0.355, 0.45, 0.16, 0.22] }
      w1: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.57, 0.36, 0.13, 0.045], text: Which roads? }
      w2: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.57, 0.45, 0.13, 0.045], text: Which time? }
      w3: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.57, 0.54, 0.13, 0.045], text: Which vehicles? }

      # State 5：住宅的三种差异（同一列，分别指向最高楼 / 另一栋公寓 / 小房子）
      r_inc: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.455, 0.33, 0.2, 0.05], text: Different income levels }
      rn_inc: { type: shape, geom: line, on: img, from: [0.455, 0.355], to: [0.325, 0.43], stroke: "#FFFFFF", strokeWidth: 4 }
      rd_inc: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: accent, strokeWidth: 3, on: img, box: [0.3205, 0.4240, 0.009, 0.012] }
      r_inf: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.455, 0.42, 0.2, 0.05], text: Different infrastructure }
      rn_inf: { type: shape, geom: line, on: img, from: [0.455, 0.445], to: [0.21, 0.54], stroke: "#FFFFFF", strokeWidth: 4 }
      rd_inf: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: accent, strokeWidth: 3, on: img, box: [0.2055, 0.5340, 0.009, 0.012] }
      r_cli: { type: shape, geom: pill, fill: accent-2, color: "#FFFFFF", size: 26, weight: bold, align: center, valign: middle, padding: 0, on: img, box: [0.455, 0.51, 0.2, 0.05], text: Different climate risks }
      rn_cli: { type: shape, geom: line, on: img, from: [0.455, 0.535], to: [0.23, 0.68], stroke: "#FFFFFF", strokeWidth: 4 }
      rd_cli: { type: shape, geom: ellipse, fill: "#FFFFFF", stroke: accent, strokeWidth: 3, on: img, box: [0.2255, 0.6740, 0.009, 0.012] }

    states:
      - show: [te, img, l_ind, n_ind, d_ind, l_pow, n_pow, d_pow, l_avi, n_avi, d_avi, l_tra, n_tra, d_tra, l_res, n_res, d_res, i_ind, i_pow, i_avi, i_tra, i_res]
        notes: Sector totals seem to reflect real human activity, so policy looks like it follows directly.
        steps:
          - { enter: img, effect: fade, duration: 900 }
          - [{ enter: [l_ind, l_pow, l_avi, l_tra, l_res, i_ind, i_pow, i_avi, i_tra, i_res, d_ind, d_pow, d_avi, d_tra, d_res], effect: pop },
             { enter: [n_ind, n_pow, n_avi, n_tra, n_res], effect: draw }]
      - show: [te, img, l_ind, n_ind, d_ind, l_pow, n_pow, d_pow, l_avi, n_avi, d_avi, l_tra, n_tra, d_tra, l_res, n_res, d_res, i_ind, i_pow, i_avi, i_tra, i_res, a1, po, q]
        notes: But we cannot go straight from total emissions to policy.
        steps:
          - [{ enter: a1, effect: wipe, from: top }, { enter: po, effect: fade-up, after: true }]
          - { enter: q, effect: pop }
      - show: [te, img, a1, ig, a2, po]
        override:
          img: { filter: "grayscale(1) brightness(1.08)" }
          po: { frame: [120, 900, 620, 80] }
        transition: { duration: 1000 }
        notes: Between emission accounting and urban action there is an information gap.
      - add: [c1, c2, c3]
        notes: Most inventories are top-down, spread with proxies and typical profiles, so we cannot tell when, where and through which behaviour emissions occurred.
        steps:
          - { enter: c1, effect: fade-up }
          - { enter: c2, effect: fade-up }
          - { enter: c3, effect: fade-up }
      - add: [ring, w1, w2, w3]
        override:
          img: { zoom: { at: [0.54, 0.56], scale: 2.1 } }
        transition: { duration: 1000 }
        notes: Knowing a sector's annual emissions is not enough to decide which roads, time slots, vehicles and traffic conditions to prioritise. (Plays automatically - zoom, circle, three questions.)
        steps:
          - { enter: ring, effect: draw, auto: true }
          - { enter: [w1, w2, w3], effect: pop, stagger: 250, auto: true }
      - remove: [ring, w1, w2, w3]
        add: [r_inc, rn_inc, rd_inc, r_inf, rn_inf, rd_inf, r_cli, rn_cli, rd_cli]
        override:
          img: { zoom: { at: [0.38, 0.58], scale: 1.8 } }
        transition: { duration: 1000 }
        notes: The same is true for residential emissions, which differ with income, infrastructure and climate risk.
        steps:
          - [{ enter: r_inc, effect: pop }, { enter: rn_inc, effect: draw, delay: 150 }, { enter: rd_inc, effect: pop, delay: 300 }]
          - [{ enter: r_inf, effect: pop }, { enter: rn_inf, effect: draw, delay: 150 }, { enter: rd_inf, effect: pop, delay: 300 }]
          - [{ enter: r_cli, effect: pop }, { enter: rn_cli, effect: draw, delay: 150 }, { enter: rd_cli, effect: pop, delay: 300 }]
      - show: [img, l_ind, n_ind, d_ind, l_pow, n_pow, d_pow, l_avi, n_avi, d_avi, l_tra, n_tra, d_tra, l_res, n_res, d_res, i_ind, i_pow, i_avi, i_tra, i_res, m1, ma1, m2, ma2, m3, m3s]
        override:
          img: { filter: "grayscale(0)", zoom: { at: [0.5, 0.5], scale: 1 } }
        transition: { duration: 1000 }
        notes: Back on the coloured map, each sector now has its own signal. High-resolution sectoral inventories, built from near-real-time activities and accurate emission factors, enable spatially explicit research and policy. (Plays automatically - sectors first, then the three boxes.)
        steps:
          - [{ enter: [l_ind, l_pow, l_avi, l_tra, l_res, i_ind, i_pow, i_avi, i_tra, i_res, d_ind, d_pow, d_avi, d_tra, d_res], effect: pop, auto: true },
             { enter: [n_ind, n_pow, n_avi, n_tra, n_res], effect: draw }]
          - { enter: m1, effect: fade-up, auto: true }
          - { enter: ma1, effect: wipe, from: top, duration: 400, auto: true }
          - { enter: m2, effect: fade-up, auto: true }
          - { enter: ma2, effect: wipe, from: top, duration: 400, auto: true }
          - [{ enter: m3, effect: fade-up, auto: true }, { enter: m3s, effect: fade-up, auto: true }]

  - id: goal
    section: What is CHETNA
    purpose: State the CHETNA goal as a four-step chain from modelling to mitigation policy, and show India as the pilot with three more developing countries to follow
    patterns: [page.chain-rows]
    layout: free
    chrome: { header: { left: "**CHETNA** goal" } }
    objects:
      b1: { type: shape, fill: accent, color: "#FFFFFF", size: 34, weight: bold, align: center, valign: middle, padding: 16, lineHeight: 1.25, frame: [120, 130, 420, 180], text: "City-wise\\nEmission Modeling" }
      b2: { type: shape, fill: accent-3, color: "#FFFFFF", size: 34, weight: bold, align: center, valign: middle, padding: 16, lineHeight: 1.25, frame: [120, 370, 420, 120], text: "Public Available Data" }
      b3: { type: shape, fill: "#9EBDD8", color: accent, size: 34, weight: bold, align: center, valign: middle, padding: 16, lineHeight: 1.25, frame: [120, 550, 420, 100], text: "Scenario Analysis" }
      b4: { type: shape, fill: accent-3-soft, color: accent-3, size: 34, weight: bold, align: center, valign: middle, padding: 16, lineHeight: 1.25, frame: [120, 710, 420, 100], text: "Mitigation Policy" }
      ga1: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [300, 326, 60, 28] }
      ga2: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [300, 506, 60, 28] }
      ga3: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [300, 666, 60, 28] }

      t1: { type: text, size: 30, color: ink, lineHeight: 1.55, valign: middle, frame: [600, 130, 1000, 180], text: "Provide [[HIGH RESOLUTION|ghost]] data for **CO₂** and **air pollutant** emissions at [[LOW LATENCY|ghost]] by dealing with the [[DATA GAP|ghost]] for urban areas & establish a **scalable blueprint** for developing country cities." }
      ch_hr: { type: shape, geom: roundRect, radius: 12, fill: "#7EB3E7", stroke: "#15406A", strokeWidth: 3, color: "#1A496B", lineHeight: 1.1, size: 30, weight: bold, align: center, valign: middle, padding: 0, frame: [710, 153, 297, 43], text: HIGH RESOLUTION }
      ch_ll: { type: shape, geom: roundRect, radius: 12, fill: "#92D050", stroke: "#3E8E2A", strokeWidth: 3, color: "#3A6F34", lineHeight: 1.1, size: 30, weight: bold, align: center, valign: middle, padding: 0, frame: [602, 199, 231, 43], text: LOW LATENCY }
      ch_dg: { type: shape, geom: roundRect, radius: 12, fill: "#FF9901", stroke: "#C36A00", strokeWidth: 3, color: "#B00300", lineHeight: 1.1, size: 30, weight: bold, align: center, valign: middle, padding: 0, frame: [1108, 199, 173, 43], text: DATA GAP }
      t2: { type: text, size: 30, color: ink, lineHeight: 1.5, valign: middle, frame: [600, 360, 1000, 140], text: "All of data will be publicly available on the project website, facilitating the data uptake by various stakeholders including **policymakers**, and **research communities**." }
      t3:
        type: text
        size: 30
        color: ink
        lineHeight: 1.5
        valign: middle
        frame: [600, 540, 1000, 290]
        text:
          - "**Analyze** urban carbon reduction scenarios to assess air quality co-benefits."
          - "**Evaluate** mitigation scenarios on targets at city, regional, and national levels."
          - "**Enable** spatially explicit, evidence-based policy decisions."

      # 国家图：印度（试点）大图，埃及 / 南非 / 土耳其小图
      im_in: { type: image, src: "assets/part 1/2.png", fit: contain, frame: [1650, 130, 230, 244] }
      im_eg: { type: image, src: "assets/part 1/3.png", fit: contain, frame: [1715, 450, 100, 100] }
      im_za: { type: image, src: "assets/part 1/4.png", fit: contain, frame: [1706, 610, 118, 100] }
