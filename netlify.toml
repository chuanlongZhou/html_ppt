# 整站部署配置：项目主页（主题与页面元素、页面结构、动画与交互）+ 所有演示（/<deck>/）。
# Netlify 只自动读取名为 netlify.toml 的文件；只部署 CHETNA 见 netlify.chetna.toml，用法见 docs/DEPLOY.md。
# 只部署部分演示：把命令改成 npm run site -- CHETNA intro

# 缩略图要用浏览器截图：先装 Chromium（headless shell）；装不上也不影响部署，主页会改用实时预览。

[build]
  command = "npm ci && (npx playwright-core install --only-shell chromium || echo '· Chromium 安装失败，跳过缩略图') && npm run site"
  publish = "output/_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
