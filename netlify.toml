# Netlify 部署配置：构建 proj/CHETNA 并发布为静态站点。
# 详见 docs/DEPLOY.md。换成别的演示：改 build.command 与 publish 中的名字。

[build]
  command = "npm ci && npm run build -- CHETNA"
  publish = "output/CHETNA/site"

[build.environment]
  NODE_VERSION = "22"
  # playwright-core 只是库，构建不需要浏览器；跳过下载以加快安装。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# 静态资源（图片、字体、脚本）可长期缓存；HTML 每次都重新校验。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
