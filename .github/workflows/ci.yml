name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 构建（不截图）：校验 deck 编译通过；截图 QA 需要 Edge，留在本地跑
      - run: npm run check -- intro --no-shots
      - run: npm run check -- library --no-shots
