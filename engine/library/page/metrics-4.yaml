id: page.metrics-4
group: data
title: 四个关键指标
order: 9
prompts: [四个数字, 关键指标, KPI 看板, 指标卡片, 数据概览, 四个指标, dashboard]
use_when: 一页同时交代 3–4 个并列的关键数字（规模、增速、占比…），每个配一句解释
avoid_when: 只有一个重点数字（用 page.big-number）；需要看趋势（用 morph.chart-grow）
en:
  title: Four key metrics
  prompts: [four metrics, KPI cards, key numbers, metrics overview]
  use_when: 3–4 parallel key numbers on one slide (scale, growth, share…), each with one line of context
  avoid_when: Only one headline number (use page.big-number); showing a trend (use morph.chart-grow)
