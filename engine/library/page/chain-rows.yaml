id: page.chain-rows
group: diagram
title: 左侧渐变链条 + 右侧逐行讲解
order: 2
prompts: [流程链条加说明, 左边步骤右边讲解, 四步流程逐行解释, 颜色逐渐变淡的步骤, 关键词标签高亮, chain with notes]
use_when: 3–4 个先后相连的步骤（颜色由深到浅），每一步在右侧有对应的一段说明；左侧自动一次性出现，右侧点击逐段出现；关键词可以用 [[词|orange|green|blue]] 做成行内标签
avoid_when: 步骤超过 5 个，或每一步的说明超过三行（拆页）
demo:
  layout: free
  objects:
    b1: { type: shape, fill: accent, color: "#FFFFFF", size: 34, weight: bold, align: center, valign: middle, frame: [120, 150, 420, 160], text: "第一步" }
    b2: { type: shape, fill: accent-3, color: "#FFFFFF", size: 34, weight: bold, align: center, valign: middle, frame: [120, 370, 420, 120], text: "第二步" }
    b3: { type: shape, fill: accent-3-soft, color: accent-3, size: 34, weight: bold, align: center, valign: middle, frame: [120, 550, 420, 120], text: "第三步" }
    a1: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [300, 326, 60, 28] }
    a2: { type: shape, geom: arrow, fill: muted, rotate: 90, frame: [300, 506, 60, 28] }
    t1: { type: text, size: 32, color: ink, lineHeight: 1.5, valign: middle, frame: [600, 150, 1200, 160], text: "解决 [[数据缺口|orange]]，以 [[低延迟|green]] 提供 [[高分辨率|blue]] 的数据" }
    t2: { type: text, size: 32, color: ink, lineHeight: 1.5, valign: middle, frame: [600, 370, 1200, 120], text: "所有数据在项目网站**公开**，方便政策制定者和研究者使用" }
    t3: { type: text, size: 32, color: ink, lineHeight: 1.5, valign: middle, frame: [600, 550, 1200, 120], text: "**分析**减排情景，**评估**目标" }
  steps:
    - { enter: [b1, a1, b2, a2, b3], effect: fade, duration: 700, auto: true }
    - { enter: t1, effect: fade-up }
    - { enter: t2, effect: fade-up }
    - { enter: t3, effect: fade-up }
