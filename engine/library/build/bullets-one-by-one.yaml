id: build.bullets-one-by-one
group: reveal
title: 逐条出现
order: 1
prompts: [逐条出现, 一条一条显示, 要点依次出现, 点一下出一条, bullets one by one]
use_when: 讲解有先后的要点，希望听众跟着讲述节奏走
avoid_when: 要点需要整体对比（一次全部显示更好）
demo:
  layout: title-body
  objects:
    title: { type: text, role: title, text: 每点击一次，出现一条 }
    points:
      type: text
      role: bullets
      text:
        - 第一条：by paragraph 让每一段占一次点击
        - 第二条：effect 选 fade-up，自下而上浮现
        - 第三条：想一次点击依次出现，加 stagger
  steps:
    - { enter: points, by: paragraph, effect: fade-up }
