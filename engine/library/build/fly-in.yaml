id: build.fly-in
group: reveal
title: 两侧飞入
order: 7
prompts: [飞入, 从两边飞进来, 左右飞入, 从屏幕外进入, fly in]
use_when: 两个对立 / 对照的对象分别从两侧进入，最后给出结论
avoid_when: 正式、克制的场合（用 fade-up 更稳）
en:
  title: Fly in from both sides
  prompts: [fly in, enter from the sides, left and right fly-in, come in from off screen]
  use_when: Two opposing or contrasting objects enter from each side, then the conclusion
  avoid_when: Formal, restrained settings (fade-up is safer)
demo:
  layout: title-body
  objects:
    title: { type: text, role: title, text: "Two sides fly in, the verdict pops last ^^两个对象从两侧飞入，结论最后弹出^^" }
    left: { type: shape, fill: surface-2, frame: [120, 290, 780, 400], valign: middle, text: ["# By hand ^^人工制作^^", "Precise but slow; hard to change in bulk ^^精细，但慢；难以批量修改^^"] }
    right: { type: shape, fill: accent-soft, frame: [1020, 290, 780, 400], valign: middle, text: ["# AI + structured source ^^AI + 结构化源文件^^", "Fast, and every change is checked ^^快，且每次修改都可检查^^"] }
    concl: { type: shape, geom: pill, fill: accent, color: "#FFFFFF", frame: [460, 740, 1000, 140], align: center, valign: middle, weight: 700, text: "Let AI edit the source, not the pixels ^^让 AI 改源文件，而不是改像素^^" }
  steps:
    - { enter: left, effect: fly-in, from: left }
    - { enter: right, effect: fly-in, from: right }
    - { enter: concl, effect: pop }
