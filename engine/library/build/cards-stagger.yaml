id: build.cards-stagger
group: reveal
title: 卡片依次浮现
order: 2
prompts: [卡片依次出现, 依次浮现, 错开出现, 一个接一个, stagger]
use_when: 一次点击让一组并列对象有节奏地出现
avoid_when: 每个对象都需要单独讲解（每个一次点击更好）
en:
  title: Staggered cards
  prompts: [stagger, cards one after another, cascade in, appear in sequence]
  use_when: One click brings in a group of parallel objects with rhythm
  avoid_when: Each object needs its own explanation (one click each is better)
demo:
  layout: { type: grid, cols: 3, cellHeight: 460 }
  objects:
    title: { type: text, role: title, text: "One click, three cards, 150 ms apart ^^一次点击，三张卡片错开 150ms 浮现^^" }
    c1: { type: shape, fill: surface, shadow: true, text: ["# 01 Parse ^^解析^^", "YAML → validate → line numbers ^^YAML → 校验 → 行号^^"] }
    c2: { type: shape, fill: surface, shadow: true, text: ["# 02 Compile ^^编译^^", "Layout and timing computed by code ^^布局、动画参数由代码算出^^"] }
    c3: { type: shape, fill: surface, shadow: true, text: ["# 03 Check ^^检查^^", "Screenshots, overflow, motion ^^截图、溢出、动画一致性^^"] }
  steps:
    - { enter: [c1, c2, c3], effect: fade-up, stagger: 150 }
