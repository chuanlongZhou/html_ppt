id: morph.acronym-collapse
group: layout
title: 缩略词收拢成品牌字
order: 7
prompts: [首字母缩写, 缩略词展开, 项目全称收拢成名字, 字母合并, 开场 morph 成 logo 字, acronym]
use_when: 开场先展开项目全称（大写首字母 + 小字），点击后首字母放大靠拢成品牌名，其余文字淡出、副标题与 logo 进场
avoid_when: 首字母不在同一基线上，或全称很长、小字挤不下
demo:
  layout: free
  theme: dark
  objects:
    shade: { type: shape, geom: rect, fill: "rgba(18,58,132,.9)", frame: [0, 0, 1920, 1080] }
    a: { type: text, size: 170, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [300, 340, 140, 170], text: A }
    b: { type: text, size: 170, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [820, 340, 140, 170], text: B }
    c: { type: text, size: 170, weight: 900, color: "#FFFFFF", lineHeight: 1, align: center, frame: [1340, 340, 140, 170], text: C }
    wa: { type: text, size: 36, color: "#FFFFFF", lineHeight: 1, frame: [430, 453, 330, 50], text: lpha study }
    wb: { type: text, size: 36, color: "#FFFFFF", lineHeight: 1, frame: [950, 453, 330, 50], text: road survey }
    wc: { type: text, size: 36, color: "#FFFFFF", lineHeight: 1, frame: [1470, 453, 330, 50], text: ity analysis }
    tag: { type: text, size: 50, weight: bold, color: "#FFFFFF", align: center, frame: [160, 640, 1600, 90], text: 一句话说明这个项目 }
  states:
    - show: [shade, a, b, c, wa, wb, wc]
    - show: [shade, a, b, c, tag]
      override:
        a: { size: 250, frame: [640, 372, 220, 290] }
        b: { size: 250, frame: [860, 372, 220, 290] }
        c: { size: 250, frame: [1080, 372, 220, 290] }
      transition: { duration: 1100 }
