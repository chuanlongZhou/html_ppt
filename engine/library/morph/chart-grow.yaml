    base: { type: shape, geom: line, from: [200, 900], to: [1720, 900], stroke: line, strokeWidth: 3 }
    b1: { type: shape, geom: roundRect, radius: 10, fill: accent-soft, frame: [260, 700, 180, 200] }
    b2: { type: shape, geom: roundRect, radius: 10, fill: accent-soft, frame: [560, 640, 180, 260] }
    b3: { type: shape, geom: roundRect, radius: 10, fill: accent-soft, frame: [860, 720, 180, 180] }
    b4: { type: shape, geom: roundRect, radius: 10, fill: accent-soft, frame: [1160, 580, 180, 320] }
    b5: { type: shape, geom: roundRect, radius: 10, fill: accent-soft, frame: [1460, 660, 180, 240] }
    v1: { type: text, role: label, size: 30, color: ink, align: center, frame: [250, 640, 200, 50], text: "200" }
    v2: { type: text, role: label, size: 30, color: ink, align: center, frame: [550, 580, 200, 50], text: "260" }
