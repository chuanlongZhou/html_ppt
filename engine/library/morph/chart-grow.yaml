id: morph.chart-grow
group: data
title: 柱状图数值变化
order: 5
prompts: [数据变化, 柱子长高, 柱状图动画, 从去年到今年, 数值增长, chart animation]
use_when: 同一组数据在两个时间点 / 两种情景之间的变化
avoid_when: 数据点超过 8 个（等 M2 的图表组件）
en:
  title: Bars that grow
  prompts: [chart animation, bars grow, this year vs last year, values change]
  use_when: One data set changing between two points in time or two scenarios
  avoid_when: More than 8 data points (use the chart component)
demo:
  layout: free
  objects:
    title: { type: text, role: title, frame: [120, 70, 1300, 150], text: "Emissions by sector: 2020 → 2024 ^^各部门排放：2020 → 2024^^" }
