id: interact.narrated
group: narrative
title: 讲述驱动 + 自由探索
order: 1
prompts: [边讲边变的图表, 讲述驱动图表, 一步步讲数据, 讲完再探索, 数据故事, narrated chart]
use_when: 先按讲述顺序推进图表（换年份 → 高亮重点），讲完后听众可自由点击探索；翻回本页时自动复位到讲述状态
avoid_when: 数据没有先后的叙事顺序（直接用 interact.bar-explore）
en:
  title: Narrate, then explore
  prompts: [narrated chart, data story, walk through the data, explore after the story]
  use_when: Advance the chart in story order (switch year → highlight the key bar); afterwards anyone can click to explore; returning to the slide resets the story
  avoid_when: The data has no narrative order (use interact.bar-explore)
demo:
  layout: free
  objects:
    title: { type: text, role: title, frame: [120, 50, 1680, 150], text: "Power drives the growth in emissions ^^排放增长主要来自电力^^" }
    chart:
      type: chart
      frame: [120, 220, 1180, 770]
      kind: bar
      categories: [Transport · 交通, Industry · 工业, Buildings · 建筑, Power · 电力, Other · 其他]
      series: { "2020": [200, 260, 180, 320, 240], "2024": [280, 380, 210, 600, 340] }
      show: ["2020"]
      switch: true
      detail: true
      unit: Mt
    note: { type: text, role: body, frame: [1360, 290, 440, 640], text: ["# ① 2020", "Five sectors, roughly even ^^五个部门大致相当^^"] }
  states:
    - {}
    - override:
        chart: { show: ["2024"] }
        note: { text: ["# ② 2024", "Every sector grew; bars rise smoothly ^^所有部门都在增长，柱子平滑长高^^"] }
    - override:
        chart: { highlight: Power · 电力 }
        note: { text: ["# ③ Focus: power ^^重点：电力^^", "320 → 600, nearly doubled ^^几乎翻倍^^", "Then click and switch years freely ^^讲完可自由点击、切换年份^^"] }
