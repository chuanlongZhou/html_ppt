id: interact.dashboard
group: linked
title: 数据面板
order: 2
prompts: [数据面板, 仪表盘, dashboard, 指标卡加图表, 可交互的数据看板, 数据大屏]
use_when: 一页同时给出关键指标与可探索的明细：顶部指标卡，下方两张联动图表（可切换年份、点击高亮）
avoid_when: 听众需要一步一步理解（拆成 interact.narrated 的多个 State）
