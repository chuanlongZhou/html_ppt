id: interact.linked-views
group: linked
title: 联动视图
order: 1
prompts: [联动图表, 图表联动, 点一个另一个跟着变, 联动高亮, linked views, crossfilter]
use_when: 同一组对象有两种视角（构成 + 趋势）：在一张图里选中，另一张图同步高亮
avoid_when: 两张图的分类 / 系列名不一致（联动按名字匹配）
demo:
  layout: { type: split, ratio: 48 }
  objects:
    title: { type: text, role: title, text: 点左边的柱子，右边的折线同步高亮 }
    bars:
      type: chart
      slot: left
      kind: bar
      categories: [电力, 工业, 交通, 建筑]
      series: { "2024": [600, 380, 280, 210] }
      link: sector
      unit: Mt
      source: 2024 年构成（示例数据）
    lines:
      type: chart
      slot: right
      kind: line
      categories: [2016, 2018, 2020, 2022, 2024]
      series:
        - { name: 电力, values: [420, 470, 480, 560, 600] }
        - { name: 工业, values: [330, 345, 300, 360, 380] }
        - { name: 交通, values: [210, 235, 200, 255, 280] }
        - { name: 建筑, values: [170, 180, 180, 200, 210] }
      legend: false
      link: sector
      unit: Mt
      source: 历年趋势（示例数据）
