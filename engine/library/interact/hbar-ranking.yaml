    chart:
      type: chart
      kind: hbar
      categories: [城市 A, 城市 B, 城市 C, 城市 D, 城市 E, 城市 F, 城市 G]
      series: { 排放量: [612, 540, 498, 430, 377, 301, 254] }
      highlight: 城市 C
      unit: Mt
      source: 示例数据 · 点击条形切换高亮
