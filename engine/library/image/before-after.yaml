id: image.before-after
group: compare
title: 前后对比
order: 1
prompts: [前后对比, 处理前处理后, 对比两张图, 修图前后, before after 图片]
use_when: 同一画面的两个版本（处理前后、改版前后、两个时间点），叠放后用擦除揭示差异
avoid_when: 两张图构图不同（并排放：page.comparison）
en:
  title: Before / after
  prompts: [before after image, compare two versions, wipe to reveal, edited vs original]
  use_when: Two versions of the same frame (before/after processing, redesign, two dates), stacked and revealed with a wipe
  avoid_when: The two images are framed differently (place side by side — page.comparison)
demo:
  layout: free
  objects:
    title: { type: text, role: title, frame: [120, 50, 1680, 150], text: "Same frame, the new version wipes in ^^同一画面，从左往右擦出新版本^^" }
    before: { type: image, src: "@lib/sample-city.png", frame: [120, 230, 1120, 700], radius: 20, filter: "grayscale(1) brightness(.9)" }
    after: { type: image, src: "@lib/sample-city.png", frame: [120, 230, 1120, 700], radius: 20 }
    lb: { type: shape, geom: pill, fill: "rgba(0,0,0,.55)", color: "#FFFFFF", align: center, valign: middle, size: 26, weight: 700, frame: [150, 260, 220, 56], z: 3, text: Before · 处理前 }
    la: { type: shape, geom: pill, fill: accent, color: "#FFFFFF", align: center, valign: middle, size: 26, weight: 700, frame: [990, 260, 220, 56], z: 3, text: After · 处理后 }
    note: { type: text, role: body, frame: [1300, 230, 500, 700], text: ["# Stack + wipe ^^叠放 + 擦除^^", "Two images, one frame; the top one wipes in ^^两张图同一个 frame；上面一张用 wipe 出现^^", "Filter: `filter: grayscale(1)` ^^滤镜^^"] }
  steps:
    - [{ enter: after, effect: wipe, from: left, duration: 1400 }, { enter: la, effect: fade, after: true }]
