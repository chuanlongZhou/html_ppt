id: image.arrow-label
group: annotate
title: 箭头 + 说明
order: 1
prompts: [加箭头, 箭头指向, 在截图上标注, 指给大家看, 加说明文字, arrow annotation]
use_when: 在截图 / 照片上指出某个位置，并在旁边写一句说明；箭头画出后说明出现
avoid_when: 需要指出的位置超过 3 处（拆成多个 State，或改用 image.spotlight）
en:
  title: Arrow + label
  prompts: [arrow annotation, point at this, annotate a screenshot, callout with arrow]
  use_when: Point at a spot in a screenshot or photo with a one-line note beside it; the arrow draws, then the note appears
  avoid_when: More than 3 spots (split into States, or use image.spotlight)
demo:
  layout: free
  objects:
    title: { type: text, role: title, frame: [120, 50, 1680, 150], text: "Arrow draws first, then the note ^^箭头先画出来，说明再出现^^" }
    shot: { type: image, src: "@lib/sample-ui.png", frame: [120, 230, 1120, 700], radius: 20, shadow: true }
    a1: { type: shape, geom: line, on: shot, from: [1.04, 0.286], to: [0.92, 0.075], arrow: end, stroke: accent-2, strokeWidth: 6 }
    l1: { type: shape, geom: roundRect, fill: accent-2, color: "#FFFFFF", frame: [1300, 290, 500, 280], valign: middle, text: ["# Export ^^导出按钮^^", "One-click report ^^一键导出报告^^"] }
    a2: { type: shape, geom: line, on: shot, from: [1.04, 0.686], to: [0.9, 0.825], arrow: end, stroke: accent, strokeWidth: 6 }
    l2: { type: shape, geom: roundRect, fill: accent, color: "#FFFFFF", frame: [1300, 600, 500, 280], valign: middle, text: ["# Pending order ^^待处理订单^^", "Status: processing ^^状态：处理中^^"] }
  steps:
    - [{ enter: a1, effect: draw }, { enter: l1, effect: fade-left, after: true }]
    - [{ enter: a2, effect: draw }, { enter: l2, effect: fade-left, after: true }]
