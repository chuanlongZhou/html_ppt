id: image.circle-mark
group: annotate
title: 圈出重点
order: 2
prompts: [加圆圈, 圈出来, 圈重点, 在照片上画圈, 标记位置, circle]
use_when: 在照片 / 地图 / 截图上圈出一两个关键位置，配一个短标签
avoid_when: 圈出的对象需要详细解释（配合 image.arrow-label）
demo:
  layout: free
  objects:
    title: { type: text, role: title, frame: [120, 70, 1680, 110], text: 一次圈出一个重点 }
    photo: { type: image, src: "@lib/sample-city.png", frame: [120, 230, 1120, 700], radius: 20, shadow: true }
    r1: { type: shape, geom: ellipse, fill: transparent, stroke: "#FFD166", strokeWidth: 6, on: photo, box: [0.585, 0.03, 0.1, 0.16] }
    t1: { type: shape, geom: pill, fill: "#FFD166", color: ink, align: center, valign: middle, size: 28, weight: 700, on: photo, box: [0.7, 0.07, 0.17, 0.08], text: 信号塔 }
    r2: { type: shape, geom: ellipse, fill: transparent, stroke: "#FFFFFF", strokeWidth: 6, on: photo, box: [0.13, 0.43, 0.22, 0.35] }
    t2: { type: shape, geom: pill, fill: "#FFFFFF", color: ink, align: center, valign: middle, size: 28, weight: 700, on: photo, box: [0.12, 0.33, 0.14, 0.08], text: 落日 }
    note: { type: text, role: body, frame: [1300, 230, 500, 700], text: ["# 圈 + 标签", "圆圈用 ellipse + 透明填充 + 描边", "位置写在图片坐标里：on: photo, box: [u, v, w, h]"] }
  steps:
    - [{ enter: r1, effect: pop }, { enter: t1, effect: fade-up, after: true }]
    - [{ enter: r2, effect: pop }, { enter: t2, effect: fade-up, after: true }]
